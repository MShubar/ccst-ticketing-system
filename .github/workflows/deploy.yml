name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web app
        run: npm run web:build

      - name: Build Worker
        run: bash backend/scripts/build-worker.sh

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test live deployment
        run: |
          set -euo pipefail
          URL="https://ccst-ticketing.mohsen-salman099.workers.dev"
          echo "=== Health check ==="
          HEALTH="$(curl -fsS --max-time 30 "$URL/api/health")"
          echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"  ok={d['ok']} storage={d['storageMode']} coreGate={d['coreGateOk']} session={d['sessionSecretOk']}\")"
          echo "$HEALTH" | grep -q '"ok":true'
          echo "$HEALTH" | grep -q '"storageMode":"d1"'
          echo "=== Login ==="
          LOGIN="$(curl -fsS -c /tmp/ci_cookie -H "Content-Type: application/json" \
            -d '{"username":"instructor","password":"ProCloud-G18"}' \
            "$URL/api/login")"
          echo "$LOGIN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"  user={d['user']['username']} role={d['user']['role']}\")"
          echo "=== /api/me ==="
          ME="$(curl -fsS -b /tmp/ci_cookie "$URL/api/me")"
          echo "$ME" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"  class={d['class']['className']} user={d['user']['username']}\")"
          echo "=== /api/tickets ==="
          TICKETS="$(curl -fsS -b /tmp/ci_cookie "$URL/api/tickets")"
          echo "$TICKETS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"  total={d['total']}\")"
          echo "=== /api/map ==="
          MAP="$(curl -fsS -b /tmp/ci_cookie "$URL/api/map?omitTopology=1")"
          echo "$MAP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"  nodes={d['nodes']['count']} links={d['links']['count']}\")"
          echo "=== /api/portals ==="
          PORTALS="$(curl -fsS -b /tmp/ci_cookie "$URL/api/portals")"
          echo "$PORTALS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"  portals={len(d.get('portals',d))}\")"
          echo "=== ccst.website ==="
          HTTP="$(curl -fsS -o /dev/null -w '%{http_code}' https://ccst.website)"
          echo "  HTTP $HTTP"
          echo "=== All smoke tests passed ==="
